onboarding:
  heroTitle: Your baby is levelling up.
  heroBody: >-
    A skill tree for the first two years. See what your little one has unlocked,
    what they might be ready for now, and what to prepare before the next big thing arrives.
  cta: Start your baby's tree
  catchUpIntro: >-
    These skills usually arrive before your baby's current age. Which can they already do?
    Untick anything they haven't done yet. No pressure, it all stays on this device.
footer: "Not a medical tool, and not a checklist to stress about. Age ranges are broad and every baby takes their own route."
